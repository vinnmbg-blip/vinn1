<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Crypto Spin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{min-height:100vh;background:#070b12;color:#fff}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top,#172642,#05070b)}.login-box{width:360px;padding:35px;background:#111827;border:1px solid #293650;border-radius:18px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.55)}.logo{font-size:32px;font-weight:bold;margin-bottom:8px}.logo span,.brand span{color:#00d9ff}.login-box p{color:#8994a9;margin-bottom:25px}.login-box input{width:100%;padding:13px;margin-bottom:14px;background:#080d16;border:1px solid #33415c;border-radius:9px;color:#fff}.login-btn,.spin-btn{border:none;color:#fff;font-weight:bold;cursor:pointer;background:linear-gradient(135deg,#00d9ff,#007cff)}.login-btn{width:100%;padding:13px;border-radius:9px}#error{margin-top:12px;color:#ff5d5d}#mainPage{display:none}header{height:70px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;background:#0c111b;border-bottom:1px solid #202b40}.brand{font-size:23px;font-weight:bold}.user{color:#aab4c7}main{max-width:900px;margin:auto;padding:40px 20px}.title{text-align:center;margin-bottom:25px}.title h1{font-size:38px}.title p{margin-top:8px;color:#8994a9}.balance{max-width:450px;margin:0 auto 28px;padding:18px;text-align:center;background:#111827;border:1px solid #293650;border-radius:15px}.balance small{color:#8792a7}.balance h2{margin-top:7px;color:#00d9ff}
.game-stage{display:flex;flex-direction:column;align-items:center;gap:22px}.wheel-icon{width:58px;height:58px;border-radius:14px;object-fit:cover;box-shadow:0 0 18px rgba(0,217,255,.22)}
.slot-wrapper{position:relative;width:min(94vw,760px);height:330px;padding:18px;background:#0e1522;border:2px solid #33415c;border-radius:24px;box-shadow:0 18px 55px rgba(0,0,0,.45);overflow:hidden}
.slot-wrapper:before,.slot-wrapper:after{content:"";position:absolute;left:0;right:0;z-index:8;height:3px;background:#00d9ff;box-shadow:0 0 18px #00d9ff;pointer-events:none}.slot-wrapper:before{top:50%;transform:translateY(-76px)}.slot-wrapper:after{top:50%;transform:translateY(76px)}
.reels{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;overflow:hidden}.reel-window{overflow:hidden;height:100%;border-radius:16px;background:#111827;border:1px solid #34435f}.reel{display:flex;flex-direction:column;gap:12px;transform:translateY(0)}.item{height:140px;flex:0 0 140px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(145deg,#1b263b,#141d2e);border-radius:16px;overflow:hidden}.item img{width:100%;height:100%;object-fit:contain;padding:10px}.item h3{position:absolute;bottom:8px;right:8px;font-size:13px;padding:5px 8px;border-radius:7px;background:rgba(0,0,0,.65)}.rolling .item{filter:blur(1.2px)}.spin-btn{padding:15px 62px;border-radius:12px;font-size:18px;box-shadow:0 8px 25px rgba(0,150,255,.25)}.spin-btn:disabled{opacity:.55;cursor:not-allowed}.result{min-height:30px;text-align:center;font-size:21px;font-weight:bold}.money{color:#35e87b}.loss{color:#ff5d5d}.history{max-width:650px;margin:35px auto;padding:20px;background:#111827;border:1px solid #293650;border-radius:15px}.history h2{margin-bottom:15px}#historyList{list-style:none}#historyList li{padding:11px 5px;color:#aab4c7;border-bottom:1px solid #252f42}
@media(max-width:600px){.login-box{width:90%}main{padding:28px 10px}.title h1{font-size:29px}.slot-wrapper{height:300px;padding:10px}.reels{gap:7px}.item{height:125px;flex-basis:125px}}

/* ===== UI BESAR & REEL DIPERBAIKI ===== */
main{max-width:1180px}
.slot-wrapper{width:min(96vw,980px);height:430px;padding:20px}
.slot-wrapper:before{top:125px;transform:none}
.slot-wrapper:after{top:305px;transform:none}
.reels{gap:18px}
.reel{gap:16px}
.item{height:180px;flex:0 0 180px}
.item .coin-svg{width:120px;height:120px;display:block}
.item h3{font-size:15px;bottom:10px;right:10px}
.wheel-icon{width:72px;height:72px}
.spin-btn{padding:18px 78px;font-size:21px}
.result{font-size:24px;margin-top:6px}
@media(max-width:600px){
  .slot-wrapper{height:350px;padding:12px}
  .slot-wrapper:before{top:85px}
  .slot-wrapper:after{top:265px}
  .reels{gap:8px}
  .reel{gap:10px}
  .item{height:170px;flex-basis:170px}
  .item .coin-svg{width:82px;height:82px}
  .item h3{font-size:11px}
}


/* ===== MENU TUKAR UANG KE SPIN ===== */
.exchange-panel{
  width:min(96vw,520px);
  margin:0 auto 28px;
  padding:20px;
  background:#111827;
  border:1px solid #293650;
  border-radius:18px;
  text-align:center;
}
.exchange-panel h3{margin-bottom:8px;color:#fff}
.exchange-panel p{color:#9ba8bd;font-size:14px;margin-bottom:14px}
.exchange-row{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.exchange-row input{
  width:150px;padding:12px;border-radius:9px;border:1px solid #33415c;
  background:#080d16;color:#fff;text-align:center;font-size:16px
}
.exchange-btn{
  border:0;border-radius:9px;padding:12px 18px;color:#fff;font-weight:bold;
  background:linear-gradient(135deg,#00d9ff,#007cff);cursor:pointer
}
.exchange-info{margin-top:12px;color:#00d9ff;font-size:14px}

</style></head><body>
<section id="loginPage"><div class="login-box"><div class="logo">Crypto<span>Spin</span></div><p>Masuk untuk memainkan game</p><input id="username" placeholder="Username"><input type="password" id="password" placeholder="Password"><button class="login-btn" onclick="login()">LOGIN</button><div id="error"></div></div></section>
<section id="mainPage"><header><div class="brand">Crypto<span>Spin</span></div><div class="user">👤 <span id="userDisplay">User</span></div></header><main>
<div class="title"><h1>🎰 Crypto Spin</h1><p>Putar 3 kotak dan cocokkan crypto yang sama</p></div><div class="balance"><small>Sisa Spin</small><h2><span id="balance">100</span> SPIN</h2><small>Perolehan Uang</small><h2>$<span id="money">0</span></h2></div>

<section class="exchange-panel">
  <h3>💱 Tukar Uang Jadi Spin</h3>
  <p>Kurs: <b>$10 = 1 Spin</b></p>
  <div class="exchange-row">
    <input id="exchangeAmount" type="number" min="10" step="10" value="10" placeholder="Jumlah $">
    <button class="exchange-btn" type="button" onclick="tukarUang()">TUKAR</button>
  </div>
  <div id="exchangeInfo" class="exchange-info"></div>
</section>

const hadiah = ["Bitcoin", "Ethereum", "PEPE"];
let saldo = 100;

function login() {
  const u = $("username").value.trim();
  const p = $("password").value.trim();
  if (!u || !p) {
    $("error").textContent = "Username dan password wajib diisi.";
    return;
  }
  $("loginPage").style.display = "none";
  $("mainPage").style.display = "block";
  $("userDisplay").textContent = u;
  updateMoney();
  updateBalance();
}

function updateMoney() {
  $("money").textContent = "$" + uang.toLocaleString("en-US");
}

function updateBalance() {
  $("balance").textContent = saldo;
}

function tukarUang() {
  if (sedangSpin) return;

  const input = $("exchangeAmount");
  const amount = Math.floor(Number(input.value));
  const info = $("exchangeInfo");

  if (!Number.isFinite(amount) || amount < 10) {
    info.textContent = "Masukkan minimal $10.";
    return;
  }

  const rounded = Math.floor(amount / 10) * 10;
  const spins = rounded / 10;

  if (rounded > uang) {
    info.textContent = "Uang tidak cukup.";
    return;
  }

  uang -= rounded;
  saldo += spins;

  updateMoney();
  updateBalance();

  info.textContent = `Berhasil! $${rounded} ditukar menjadi ${spins} Spin.`;
  input.value = 10;
}

function makeItem(nama) {
  return `<div class="item">${iconSvg[nama]}<h3>${nama}</h3></div>`;
}

function setupReels() {
  const reels = $("reels");
  reels.innerHTML = "";
  for (let i = 0; i < 3; i++) {
    const windowEl = document.createElement("div");
    windowEl.className = "reel-window";
    const reel = document.createElement("div");
    reel.className = "reel";
    reel.id = "reel" + i;

    let content = "";
    for (let j = 0; j < 24; j++) {
      content += makeItem(hadiah[j % 3]);
    }

    reel.innerHTML = content;
    windowEl.appendChild(reel);
    reels.appendChild(windowEl);
  }
}

/*
  Peluang per spin:
  25% PEPE x3
  16% ETH x3
  17% BTC x3
  42% ZONK
*/
function generateHasil() {
  const r = Math.random();

  if (r < 0.25) return [2, 2, 2];          // 25%
  if (r < 0.41) return [1, 1, 1];          // +16%
  if (r < 0.58) return [0, 0, 0];          // +17%

  // 42% ZONK: pastikan bukan tiga simbol yang sama.
  let hasil;
  do {
    hasil = Array.from({length: 3}, () => Math.floor(Math.random() * 3));
  } while (
    (hasil[0] === hasil[1] && hasil[1] === hasil[2])
  );
  return hasil;
}

function spin() {
  if (sedangSpin) return;

  if (saldo <= 0) {
    $("result").textContent = "❌ Spin kamu habis. Tukar uang menjadi Spin.";
    return;
  }

  sedangSpin = true;
  saldo--;
  updateBalance();

  $("spinButton").disabled = true;
  $("result").textContent = "";
  $("result").className = "result";
  $("slotWrapper").classList.add("rolling");

  const hasil = generateHasil();

  const STEP = 196;
  const CENTER_TOP = 125;
  const durations = [2400, 2900, 3400];

  hasil.forEach((h, i) => {
    const reel = $("reel" + i);
    const target = 15 + h;
    const posisi = CENTER_TOP - (target * STEP);

    reel.style.transition = "none";
    reel.style.transform = "translateY(0px)";
    void reel.offsetHeight;

    setTimeout(() => {
      reel.style.transition =
        `transform ${durations[i]}ms cubic-bezier(.08,.82,.18,1)`;
      reel.style.transform = `translateY(${posisi}px)`;
    }, 40);
  });

  setTimeout(() => {
    $("slotWrapper").classList.remove("rolling");

    const combo = hasil.map(i => hadiah[i]);
    let pesan = "";
    let kelas = "";
    let isCombo = false;

    if (hasil.every(x => x === 0)) {
      uang += 200;
      pesan = "🎉 BTC | BTC | BTC — +$200";
      kelas = "money";
      isCombo = true;
    } else if (hasil.every(x => x === 1)) {
      uang += 4;
      pesan = "🎉 ETH | ETH | ETH — +$4";
      kelas = "money";
      isCombo = true;
    } else if (hasil.every(x => x === 2)) {
      uang -= 50;
      pesan = "💥 PEPE | PEPE | PEPE — -$50";
      kelas = "loss";
      isCombo = true;
    } else {
      pesan = "😵 ZONK! Kombinasi tidak cocok.";
    }

    updateMoney();

    // Sound baru untuk PEPE x3 dan ZONK.
    if (hasil.every(x => x === 2) || !isCombo) {
      const pepeZonkSound = $("pepeZonkSound");
      if (pepeZonkSound) {
        pepeZonkSound.currentTime = 0;
        pepeZonkSound.play().catch(() => {});
      }
    } else if (isCombo) {
      // Sound sebelumnya tetap untuk BTC x3 dan ETH x3.
      const sound = $("btcEthSound");
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(() => {});
      }
    }

    $("result").className = "result " + kelas;
    $("result").textContent = pesan;

    tambahRiwayat(combo.join(" | "), pesan);

    sedangSpin = false;
    $("spinButton").disabled = false;
  }, 3550);
}

function tambahRiwayat(kombinasi, pesan) {
  const list = $("historyList");
  if (
    list.children.length === 1 &&
    list.children[0].textContent.includes("Belum ada hasil")
  ) {
    list.innerHTML = "";
  }

  const li = document.createElement("li");
  li.textContent =
    `🎰 ${new Date().toLocaleTimeString("id-ID")} — ${kombinasi} → ${pesan}`;

  list.insertBefore(li, list.firstChild);
}

document.addEventListener("DOMContentLoaded", () => {
  setupReels();
  updateMoney();
  updateBalance();
});
</script>
